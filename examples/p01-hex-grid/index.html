<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoC 01 — 六角格地图</title>
<link rel="stylesheet" href="../../lib/ui.css">
<style>
  .legend { display:flex; gap:16px; margin-top:10px; flex-wrap:wrap; justify-content:center; font-size:12px; color:#aaa; }
  .legend span { display:inline-flex; align-items:center; gap:4px; }
  .swatch { width:14px; height:14px; border:1px solid #555; border-radius:2px; }
</style>
</head>
<body>
<h1>PoC 01 — 六角格地图渲染</h1>
<div class="sub">悬停或点击格查看坐标</div>
<canvas id="canvas"></canvas>
<div id="info">悬停或点击格子查看坐标</div>
<div class="legend" id="legend"></div>
<script src="../../lib/hex.js"></script>
<script>
const CFG = { hexSize: 30, cols: 9, rows: 11 };

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resize() {
  const s = Hex.canvasSize(CFG.cols, CFG.rows, CFG.hexSize);
  canvas.width = s.width; canvas.height = s.height;
  draw();
}

let hovered = null, selected = null;

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#2a2a3e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  Hex.eachCell(CFG.cols, CFG.rows, (q, r) => {
    const c = Hex.hexToPixel(q, r, CFG.hexSize);
    Hex.path(ctx, c.x, c.y, CFG.hexSize);

    let fill = '#444466';
    if (selected && selected.q === q && selected.r === r) fill = 'rgba(100,255,140,0.4)';
    else if (hovered && hovered.q === q && hovered.r === r) fill = 'rgba(100,140,255,0.3)';
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = '#555577';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = '#666688';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${q},${r}`, c.x, c.y + 1);
  });

  const info = document.getElementById('info');
  if (selected) { info.textContent = `选中: (${selected.q}, ${selected.r})`; info.style.color = '#88ffaa'; }
  else if (hovered) { info.textContent = `悬停: (${hovered.q}, ${hovered.r})`; info.style.color = '#88aaff'; }
  else { info.textContent = '悬停或点击格子查看坐标'; info.style.color = '#888'; }
}

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  const h = Hex.pixelToHex(e.clientX - r.left, e.clientY - r.top, CFG.hexSize);
  hovered = (h.q >= 0 && h.q < CFG.cols && h.r >= 0 && h.r < CFG.rows) ? h : null;
  draw();
});
canvas.addEventListener('mouseleave', () => { hovered = null; draw(); });
canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  const h = Hex.pixelToHex(e.clientX - r.left, e.clientY - r.top, CFG.hexSize);
  selected = (h.q >= 0 && h.q < CFG.cols && h.r >= 0 && h.r < CFG.rows) ? h : null;
  draw();
});
window.addEventListener('resize', resize);

resize();
</script>
</body>
</html>
