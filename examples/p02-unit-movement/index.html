<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoC 02 — 单位移动</title>
<link rel="stylesheet" href="../../lib/ui.css">
<style>
  .legend { display:flex; gap:12px; margin-top:8px; flex-wrap:wrap; justify-content:center; font-size:12px; color:#aaa; }
  .dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:3px; vertical-align:middle; }
</style>
</head>
<body>
<h1>PoC 02 — 单位放置与移动</h1>
<div class="sub">点击单位选择 → 显示移动范围 → 点击目标格移动</div>
<canvas id="canvas"></canvas>
<div id="info">选择一个己方单位(蓝色)查看移动范围</div>
<div class="legend">
  <span><span class="dot" style="background:#4488cc"></span>己方</span>
  <span><span class="dot" style="background:#cc4444"></span>敌方</span>
  <span><span class="dot" style="background:rgba(100,255,140,0.3)"></span>可达</span>
  <span><span class="dot" style="background:#ffff88"></span>选中</span>
  <span><span class="dot" style="background:#ff8800"></span>已行动</span>
</div>
<script src="../../lib/hex.js"></script>
<script src="../../lib/terrain.js"></script>
<script src="../../lib/unit.js"></script>
<script>
const CFG = { hexSize: 28, cols: 9, rows: 11 };
const terrainMap = TerrainLib.defaultMap9x11();
const getCost = (q, r) => TerrainLib.fromIndex(terrainMap, q, r).moveCost;
const getColor = (q, r) => TerrainLib.fromIndex(terrainMap, q, r).color;

const units = [
  UnitLib.create(UnitLib.SIDES.BLUE, 1, 5, 4),
  UnitLib.create(UnitLib.SIDES.BLUE, 2, 4, 3),
  UnitLib.create(UnitLib.SIDES.BLUE, 0, 6, 6),
  UnitLib.create(UnitLib.SIDES.RED,  7, 3, 4),
  UnitLib.create(UnitLib.SIDES.RED,  6, 5, 4),
];

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let sel = null, range = null;

function resize() {
  const s = Hex.canvasSize(CFG.cols, CFG.rows, CFG.hexSize);
  canvas.width = s.width; canvas.height = s.height;
  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const occ = UnitLib.occupiedSet(units);

  Hex.eachCell(CFG.cols, CFG.rows, (q, r) => {
    const c = Hex.hexToPixel(q, r, CFG.hexSize);
    Hex.path(ctx, c.x, c.y, CFG.hexSize);

    let fill = getColor(q, r);
    if (range && range.has(`${q},${r}`) && !occ.has(`${q},${r}`))
      fill = 'rgba(100,255,140,0.25)';
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = '#333355';
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  for (const u of units)
    UnitLib.draw(ctx, u, CFG.hexSize, sel && sel.id === u.id);

  const info = document.getElementById('info');
  if (sel) {
    info.textContent = `已选: 单位 ${sel.id} | 移动力: ${sel.movePoints} | 可达: ${range ? range.size - 1 : 0} 格`;
    info.style.color = '#88ffaa';
  } else {
    info.textContent = '点击蓝色单位选择，点击绿色格子移动';
    info.style.color = '#888';
  }
}

canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  const h = Hex.pixelToHex(e.clientX - r.left, e.clientY - r.top, CFG.hexSize);
  if (h.q < 0 || h.q >= CFG.cols || h.r < 0 || h.r >= CFG.rows) { sel = null; range = null; draw(); return; }

  const unit = UnitLib.findAt(h.q, h.r, units);
  if (unit && unit.side === UnitLib.SIDES.BLUE) {
    sel = unit;
    range = UnitLib.moveRange(unit, units, CFG.cols, CFG.rows, getCost);
    draw();
  } else if (sel && range && range.has(`${h.q},${h.r}`)) {
    if (!UnitLib.findAt(h.q, h.r, units)) {
      sel.q = h.q; sel.r = h.r;
      sel.hasActed = true;
      sel = null; range = null;
      draw();
    }
  } else {
    sel = null; range = null; draw();
  }
});

window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
