<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoC 03 — 地形系统</title>
<link rel="stylesheet" href="../../lib/ui.css">
<style>
  .legend { display:flex; gap:16px; margin-top:10px; flex-wrap:wrap; justify-content:center; }
  .legend-item { display:flex; align-items:center; gap:4px; font-size:12px; color:#aaa; }
  .swatch { width:14px; height:14px; border:1px solid #555; border-radius:2px; }
</style>
</head>
<body>
<h1>PoC 03 — 地形系统</h1>
<div class="sub">5 种地形 | 点击查看属性</div>
<canvas id="canvas"></canvas>
<div id="info">点击格子查看地形属性</div>
<div class="legend" id="legend"></div>
<script src="../../lib/hex.js"></script>
<script src="../../lib/terrain.js"></script>
<script>
const CFG = { hexSize: 30, cols: 9, rows: 11 };
const terrainMap = TerrainLib.defaultMap9x11();

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let selected = null;

function resize() {
  const s = Hex.canvasSize(CFG.cols, CFG.rows, CFG.hexSize);
  canvas.width = s.width; canvas.height = s.height;
  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  Hex.eachCell(CFG.cols, CFG.rows, (q, r) => {
    const c = Hex.hexToPixel(q, r, CFG.hexSize);
    const t = TerrainLib.fromIndex(terrainMap, q, r);

    Hex.path(ctx, c.x, c.y, CFG.hexSize);
    ctx.fillStyle = t.color;
    ctx.fill();
    ctx.strokeStyle = '#333355';
    ctx.lineWidth = 1;
    ctx.stroke();

    if (t.icon) {
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(t.icon, c.x, c.y);
    }

    if (selected && selected.q === q && selected.r === r) {
      Hex.path(ctx, c.x, c.y, CFG.hexSize);
      ctx.strokeStyle = '#ffff88';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
  });

  const info = document.getElementById('info');
  if (selected) {
    const t = TerrainLib.fromIndex(terrainMap, selected.q, selected.r);
    info.innerHTML = `(${selected.q}, ${selected.r}) — ${t.name} | 移动: ${t.moveCost} | 防御: +${t.defense} | 全掩体: ${t.fullCover ? '是' : '否'}`;
    info.style.color = '#88ffaa';
  } else {
    info.textContent = '点击格子查看地形属性';
    info.style.color = '#888';
  }
}

// 图例
document.getElementById('legend').innerHTML = TerrainLib.legendHTML();

canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  const h = Hex.pixelToHex(e.clientX - r.left, e.clientY - r.top, CFG.hexSize);
  selected = (h.q >= 0 && h.q < CFG.cols && h.r >= 0 && h.r < CFG.rows) ? h : null;
  draw();
});

window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
