<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoC 04 — 回合流程</title>
<link rel="stylesheet" href="../../lib/ui.css">
<style>
.info-bar { display:flex; gap:24px; margin-bottom:10px; font-size:13px; color:#aaa; }
.info-bar .phase { padding:2px 10px; border-radius:4px; font-weight:bold; }
#controls { display:flex; gap:10px; margin-top:10px; }
button { background:#333355; color:#e0e0e0; border:1px solid #555577; padding:6px 16px; font-size:13px; font-family:inherit; cursor:pointer; border-radius:4px; }
button:hover { background:#444466; }
button:disabled { opacity:0.4; cursor:default; }
#log { margin-top:10px; width:600px; max-height:120px; overflow-y:auto; font-size:12px; color:#888; border-top:1px solid #333; padding-top:6px; }
#log div { padding:2px 0; }
.legend { display:flex; gap:12px; margin-top:6px; font-size:12px; color:#aaa; }
.dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:3px; vertical-align:middle; }
canvas { border:1px solid #333; cursor:pointer; }
</style>
</head>
<body>
<h1>PoC 04 — 回合流程</h1>
<div class="info-bar">
  <span>回合: <b id="turnDisplay">1</b> / 12</span>
  <span>阶段: <span id="phaseDisplay" class="phase">评估</span></span>
  <span>己方: <b id="unitCount">0</b></span>
</div>
<canvas id="canvas"></canvas>
<div id="controls">
  <button id="btnAssess">📋 评估</button>
  <button id="btnCommand">⚔ 命令</button>
  <button id="btnSign">✍ 签署</button>
  <button id="btnEndTurn">⏭ 结束回合</button>
</div>
<div class="legend">
  <span><span class="dot" style="background:#4488cc"></span>己方</span>
  <span><span class="dot" style="background:#cc4444"></span>敌方</span>
  <span><span class="dot" style="background:rgba(100,255,140,0.3)"></span>可达</span>
  <span><span class="dot" style="background:#ff8800"></span>已行动</span>
</div>
<div id="log"><div style="color:#666">=== 游戏开始 ===</div></div>
<script src="../../lib/hex.js"></script>
<script src="../../lib/terrain.js"></script>
<script src="../../lib/unit.js"></script>
<script>
const MAX_TURNS = 12;
const CFG = { hexSize: 26, cols: 9, rows: 7 };

const Phase = { ASSESSMENT:0, INTENT:1, COMMAND:2, SIGNING:3, EXECUTION:4, ENEMY_TURN:5, GAME_OVER:6 };
const PHASE_NAMES = ['评估','意图','命令','签署','执行','敌方回合','结束'];
const PHASE_COLORS = ['#888','#88aaff','#88ffaa','#ffaa44','#ff6644','#cc4444','#f00'];

const terrainMap = TerrainLib.defaultMap9x7();
const getCost = (q,r) => TerrainLib.fromIndex(terrainMap,q,r).moveCost;
const getColor = (q,r) => TerrainLib.fromIndex(terrainMap,q,r).color;

UnitLib.resetIdCounter();
const units = [
  UnitLib.create(UnitLib.SIDES.BLUE, 1,1,4),
  UnitLib.create(UnitLib.SIDES.BLUE, 2,5,3),
  UnitLib.create(UnitLib.SIDES.BLUE, 0,3,5),
  UnitLib.create(UnitLib.SIDES.RED,  7,3,4),
  UnitLib.create(UnitLib.SIDES.RED,  6,2,4),
  UnitLib.create(UnitLib.SIDES.RED,  7,4,4),
];

const state = { turn:1, phase:Phase.ASSESSMENT, sel:null, range:null, logs:[] };

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resize() {
  const s = Hex.canvasSize(CFG.cols, CFG.rows, CFG.hexSize);
  canvas.width = s.width; canvas.height = s.height;
  draw();
}

function addLog(msg) {
  state.logs.push(msg);
  const d = document.getElementById('log');
  const e = document.createElement('div');
  e.textContent = msg; d.appendChild(e);
  d.scrollTop = d.scrollHeight;
}

function updateUI() {
  document.getElementById('turnDisplay').textContent = state.turn;
  const pd = document.getElementById('phaseDisplay');
  pd.textContent = PHASE_NAMES[state.phase];
  pd.style.background = PHASE_COLORS[state.phase];
  document.getElementById('unitCount').textContent = units.filter(u=>u.side===UnitLib.SIDES.BLUE&&u.alive).length;
  document.getElementById('btnAssess').disabled = state.phase !== Phase.ASSESSMENT;
  document.getElementById('btnCommand').disabled = state.phase !== Phase.INTENT;
  document.getElementById('btnSign').disabled = state.phase !== Phase.COMMAND || units.filter(u=>u.side===UnitLib.SIDES.BLUE&&u.alive&&!u.hasActed).length > 0;
  document.getElementById('btnEndTurn').disabled = state.phase !== Phase.COMMAND;
}

function aiTurn() {
  addLog('--- 敌方回合 ---');
  const enemies = units.filter(u => u.side === UnitLib.SIDES.RED && u.alive);
  for (const e of enemies) {
    const targets = units.filter(u => u.side === UnitLib.SIDES.BLUE && u.alive);
    if (!targets.length) break;
    const nearest = targets.reduce((a,b) => (Math.abs(a.q-e.q)+Math.abs(a.r-e.r) < Math.abs(b.q-e.q)+Math.abs(b.r-e.r)) ? a : b);
    const nq = e.q + Math.sign(nearest.q - e.q);
    const nr = e.r + Math.sign(nearest.r - e.r);
    if (nq>=0 && nq<CFG.cols && nr>=0 && nr<CFG.rows) {
      const occ = UnitLib.occupiedSet(units);
      if (!occ.has(`${nq},${nr}`)) { e.q=nq; e.r=nr; addLog(`敌方 ${e.id} → (${nq},${nr})`); }
    }
    e.hasActed = true;
  }
  for (const u of units) u.hasActed = false;
  state.turn++;
  if (state.turn > MAX_TURNS) { state.phase = Phase.GAME_OVER; addLog('=== 回合上限到达 ==='); }
  else { state.phase = Phase.ASSESSMENT; addLog(`--- 第 ${state.turn} 回合 ---`); }
  updateUI(); draw();
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#1a1a2e'; ctx.fillRect(0,0,canvas.width,canvas.height);

  const occ = UnitLib.occupiedSet(units);
  Hex.eachCell(CFG.cols, CFG.rows, (q,r) => {
    const c = Hex.hexToPixel(q,r,CFG.hexSize);
    Hex.path(ctx,c.x,c.y,CFG.hexSize);
    let fill = getColor(q,r);
    if (state.range && state.range.has(`${q},${r}`) && !occ.has(`${q},${r}`))
      fill = 'rgba(100,255,140,0.25)';
    ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle='#333355'; ctx.lineWidth=1; ctx.stroke();
  });

  for (const u of units) UnitLib.draw(ctx,u,CFG.hexSize, state.sel && state.sel.id===u.id);

  if (state.phase === Phase.GAME_OVER) {
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#fff'; ctx.font='bold 24px monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('游戏结束',canvas.width/2,canvas.height/2);
  }
}

canvas.addEventListener('click', e => {
  if (state.phase !== Phase.COMMAND) return;
  const r = canvas.getBoundingClientRect();
  const h = Hex.pixelToHex(e.clientX-r.left,e.clientY-r.top,CFG.hexSize);
  if (h.q<0||h.q>=CFG.cols||h.r<0||h.r>=CFG.rows) { state.sel=null; state.range=null; draw(); return; }

  const unit = UnitLib.findAt(h.q,h.r,units);
  if (unit && unit.side===UnitLib.SIDES.BLUE && !unit.hasActed) {
    state.sel = unit;
    state.range = UnitLib.moveRange(unit,units,CFG.cols,CFG.rows,getCost);
    draw();
  } else if (state.sel && state.range && state.range.has(`${h.q},${h.r}`)) {
    if (!UnitLib.findAt(h.q,h.r,units)) {
      state.sel.q=h.q; state.sel.r=h.r;
      state.sel.hasActed=true;
      addLog(`单位 ${state.sel.id} → (${h.q},${h.r})`);
      state.sel=null; state.range=null;
      draw();
    }
  } else { state.sel=null; state.range=null; draw(); }
});

document.getElementById('btnAssess').addEventListener('click',()=>{ state.phase=Phase.INTENT; addLog('评估完成'); updateUI(); });
document.getElementById('btnCommand').addEventListener('click',()=>{ state.phase=Phase.COMMAND; addLog('意图确定'); updateUI(); });
document.getElementById('btnEndTurn').addEventListener('click',()=>{
  if (state.phase !== Phase.COMMAND) return;
  state.sel=null; state.range=null; state.phase=Phase.SIGNING;
  const rem = units.filter(u=>u.side===UnitLib.SIDES.BLUE&&u.alive&&!u.hasActed);
  if (rem.length) { addLog(`⚠ ${rem.length} 单位未行动，跳过`); rem.forEach(u=>u.hasActed=true); }
  addLog('命令完成，待签署');
  document.getElementById('btnSign').disabled = false;
  updateUI(); draw();
});
document.getElementById('btnSign').addEventListener('click',()=>{
  state.phase = Phase.EXECUTION;
  addLog('命令签署');
  setTimeout(()=>{ state.phase=Phase.ENEMY_TURN; updateUI(); aiTurn(); draw(); }, 800);
  updateUI();
});

window.addEventListener('resize', resize);
updateUI();
resize();
</script>
</body>
</html>
